[project]
name = "terrax-api"
version = "0.1.0"
description = "TERRA-X planetary analogue intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "geoalchemy2>=0.16",
  "shapely>=2.0",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "numpy>=2.1",
  "scipy>=1.14",
  "httpx>=0.27",
  "tenacity>=9.0",
  "orjson>=3.10",
  "python-multipart>=0.0.12",
  "python-dateutil>=2.9",
  "reportlab>=4.2",
  "pillow>=11.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "network: tests that access public scientific data services",
  "integration: tests that require the database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
